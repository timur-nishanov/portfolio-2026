<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>reel</title>
<!--
  The reel as a composition: the site's own footage (plates recorded with
  scripts/reel) and the cases' recordings in the site's own device frames,
  set in 3D. Nothing here moves on its own: render.mjs calls renderAt(t, ft)
  for every frame (and the moments blended into its motion blur), and the
  page draws exactly that moment. Served from the recording copy of the site
  (serve.mjs), so the font, the frames and the clips are its own.

  The story, with no words but the first and the last:
  - "Hey! I’m Timur", set big, settles into the hero's own title;
  - the hand comes in and flings the head, which knocks round the hero;
  - the page pulls back from full frame into 3D and scrolls into the cases;
  - the camera travels along the cases, each in its device, a moment at each;
  - the three diplomas drop onto a stack;
  - the camera comes up to the last screen, the balls drop in;
  - the address, set as the first words were.
-->
<style>
  @font-face {
    font-family: inter;
    src: url(/_next/static/media/32b04a225cda6443-s.p.woff2) format('woff2');
    font-weight: 100 900;
  }
  html, body {
    margin: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #f7f7f5;
  }
  #stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: inter, sans-serif;
    color: #08080a;
    /* The page's off-white, a touch lighter in the middle. */
    background: radial-gradient(120% 90% at 50% 45%, #fbfbf9 0%, #f7f7f5 45%, #eeeeeb 100%);
  }
  .layer { position: absolute; inset: 0; }
  .world {
    position: absolute;
    inset: 0;
    perspective: 2400px;
    perspective-origin: 50% 50%;
  }
  .rig, .group {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
  }
  .rig { left: 50%; top: 50%; }
  .plane {
    position: absolute;
    overflow: hidden;
    background: #f7f7f5;
    backface-visibility: hidden;
  }
  .plane video, .screen video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .dev { position: absolute; transform-style: flat; }
  .dev .shade { position: absolute; }
  .dev .screen { position: absolute; overflow: hidden; background: #fff; }
  .dev .frame { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .poster { position: absolute; border-radius: 3px; overflow: hidden; }
  .poster img { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// --- time helpers ------------------------------------------------------------------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const span = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outCubic: (x) => 1 - Math.pow(1 - x, 3),
  inCubic: (x) => x * x * x,
  inOutCubic: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  inOutSine: (x) => -(Math.cos(Math.PI * x) - 1) / 2,
  outExpo: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  inOutQuart: (x) => (x < 0.5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2),
  // No jolt anywhere, ends or middle: the camera's moves, whose speed the
  // bank and the pull back follow.
  smooth: (x) => x * x * x * (x * (x * 6 - 15) + 10),
};
// A settle with a little give, for things that land.
const outBack = (x, s = 1.2) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);

// --- building blocks -------------------------------------------------------------------
const stage = document.getElementById('stage');
const el = (tag, cls, parent = stage, css = '') => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (css) n.style.cssText = css;
  parent.appendChild(n);
  return n;
};
const FPS = 60;
const videos = [];
function video(src, parent) {
  const v = el('video', '', parent);
  v.src = src;
  v.muted = true;
  v.preload = 'auto';
  v.playsInline = true;
  videos.push(v);
  return v;
}
// A clip shows one whole frame, the one for the reel's frame: its frames are
// stamped to the millisecond (0.017, 0.033, ...), so a seek to exactly n/60
// lands on the frame before every third time and the clip stutters. The
// middle of the frame is safe. Before its start a clip holds its first frame,
// after its end its last. `skip`: the 1/60 s slots (sorted) in which the
// phone's recording holds the frame before in the middle of a motion, left
// out so the motion runs evenly.
function seekFrame(v, time, skip = []) {
  if (!Number.isFinite(v.duration)) return Promise.resolve();
  let n = Math.floor(time * FPS + 1e-6);
  for (const s of skip) if (s <= n) n++;
  n = clamp(n, 0, Math.floor(v.duration * FPS) - 1);
  if (v.frameNo === n && v.readyState >= 2) return Promise.resolve();
  v.frameNo = n;
  return new Promise((res) => {
    let timer;
    const done = () => { v.removeEventListener('seeked', done); clearTimeout(timer); res(); };
    v.addEventListener('seeked', done);
    timer = setTimeout(done, 5000);
    v.currentTime = (n + 0.5) / FPS;
  });
}
const show = (n, on) => { n.style.visibility = on ? 'visible' : 'hidden'; };
const tf = (o) =>
  `translate3d(${(o.x || 0).toFixed(2)}px, ${(o.y || 0).toFixed(2)}px, ${(o.z || 0).toFixed(2)}px)` +
  ` rotateX(${(o.rx || 0).toFixed(3)}deg) rotateY(${(o.ry || 0).toFixed(3)}deg) rotateZ(${(o.rz || 0).toFixed(3)}deg)` +
  ` scale(${(o.s ?? 1).toFixed(5)})`;

// The site's device frames (PhoneMockup, MonitorMockup): the clip under the
// frame's transparent screen, at the frame's own insets. A phone's shadow is
// a box of its own under the frame, with the body's corners (a drop-shadow
// filter on a turned device came out cut off square at its layer's edge); a
// monitor's is a soft patch under its stand.
function phone(parent, src, w) {
  const h = Math.round((w * 1489) / 720);
  const d = el('div', 'dev', parent, `width:${w}px;height:${h}px;left:${-w / 2}px;top:${-h / 2}px`);
  el('div', 'shade', d, 'left:0.6%;right:0.6%;top:0;bottom:0;border-radius:21% / 10.2%;' +
    'box-shadow:0 2px 6px rgba(8,8,10,.05),0 24px 48px -16px rgba(8,8,10,.15),0 60px 100px -40px rgba(8,8,10,.14)');
  const sc = el('div', 'screen', d, 'left:3.97%;top:1.62%;width:91.98%;height:96.72%;border-radius:9.9% / 4.55%');
  const v = video(src, sc);
  const f = el('img', 'frame', d);
  f.src = '/mockups/iphone-frame.webp';
  return { d, v };
}
function monitor(parent, src, w) {
  const h = Math.round((w * 1256) / 1600);
  const d = el('div', 'dev', parent, `width:${w}px;height:${h}px;left:${-w / 2}px;top:${-h / 2}px`);
  el('div', 'shade', d, 'left:33%;width:34%;top:96.2%;height:4.6%;border-radius:50%;' +
    'background:radial-gradient(closest-side,rgba(8,8,10,.2),rgba(8,8,10,.07) 55%,rgba(8,8,10,0))');
  const sc = el('div', 'screen', d, `left:${(33 / 1600) * 100}%;top:${(33 / 1256) * 100}%;width:${(1534 / 1600) * 100}%;height:${(863 / 1256) * 100}%`);
  const v = video(src, sc);
  const f = el('img', 'frame', d);
  f.src = '/mockups/monitor-frame.webp';
  return { d, v };
}

// --- the world --------------------------------------------------------------------------
const world = el('div', 'world');
const rig = el('div', 'rig', world);

// Station 0: the site itself, on one plane: full frame at first.
const g0 = el('div', 'group', rig);
const site = el('div', 'plane', g0, 'width:1920px;height:1080px;left:-960px;top:-540px');
const siteVid = video('/reel2/p-hero.webm', site);
// Over the hero's own title until the big one lands on it.
const patch = el('div', '', site, 'position:absolute;left:836px;top:22px;width:196px;height:42px;background:#f7f7f5');
// And over its button, so the button comes in after the title has landed.
const patch2 = el('div', '', site, 'position:absolute;left:1032px;top:14px;width:40px;height:54px;background:#f7f7f5');
// The hand-over: one frame, between two frames' shutters, so no frame's
// motion blur mixes the two titles (theirs and ours differ by a hair).
const SWAP = 2.5 + 0.5 / 60;

// Station 1: Kritika, three phones, three different screens, each with its
// moment in turn, left to right: the scale's poo bursting on the first
// screen, a review's ratings (hearts for Love it), the profile's badges.
// These recordings run at 57 fps, a 1/60 s slot empty every so often (and the
// profile's held most frames of the badges sheet coming up): the slots that
// would hold the frame before in the middle of a motion are left out.
const g1 = el('div', 'group', rig);
const k = [
  ['/reel2/k-05-onboarding.webm', 2.0, -480, [190, 210, 230, 250, 270]],
  ['/reel2/k-02-add-review-2.webm', 10.1, 0, [694, 719, 725, 726, 731, 744, 756, 769, 781, 794, 806]],
  ['/reel2/k-06-profile.webm', 2.4, 480, [270, 271, 272, 275, 276, 277, 279, 281, 283, 285, 286, 289, 290, 291, 293, 295]],
].map(([src, inPt, x, skip]) => ({ ...phone(g1, src, 404), inPt, x: x * 1.06, skip }));

// Station 2: Urbantiger on the monitor.
const g2 = el('div', 'group', rig);
const urb = { ...monitor(g2, '/mockups/urbantiger-case-2.mp4', 1180), inPt: 0.5 };

// Station 3: Chums, and Alice opening for the first time: the tap on its
// icon, the glow, the greeting.
const g3 = el('div', 'group', rig);
const pair = [
  { ...phone(g3, '/mockups/chums-case-3.mp4', 412), inPt: 0.2, x: -290 },
  { ...phone(g3, '/cases/alice/08-onboarding.mp4', 412), inPt: 0.2, x: 290, skip: [81, 117, 225] },
];

// Station 4: Lendly and Yandex Cloud, two monitors.
const g4 = el('div', 'group', rig);
const mons = [
  { ...monitor(g4, '/mockups/lendly-case.mp4', 840), inPt: 0.3, x: -450, skip: [175, 183] },
  { ...monitor(g4, '/mockups/yc-case-2.mp4', 840), inPt: 0.5, x: 450 },
];

// Station 5: the diplomas.
const g5 = el('div', 'group', rig);
const posters = [
  ['/awards/posters/awwwards-sotd.webp', 728, 966, -330, -5.5],
  ['/awards/posters/fwa-otd.webp', 728, 1030, 0, 2.0],
  ['/awards/posters/cssda-wotd.webp', 728, 1028, 330, 6.0],
].map(([src, w, h, x, rz], i) => {
  const W = 400;
  const H = Math.round((W * h) / w);
  const p = el('div', 'poster', g5, `width:${W}px;height:${H}px;left:${-W / 2}px;top:${-H / 2}px;` +
    'box-shadow:0 0 0 1px rgba(8,8,10,.04),0 30px 50px -18px rgba(8,8,10,.28),0 10px 18px -10px rgba(8,8,10,.16)');
  const im = el('img', '', p);
  im.src = src;
  return { p, x, rz, i };
});

// Station 6: the end of the page, the balls dropping in.
const g6 = el('div', 'group', rig);
const outro = el('div', 'plane', g6, 'width:1920px;height:1080px;left:-960px;top:-540px');
const outroVid = video('/reel2/p-outro.webm', outro);

// The words: the first, then the address, set alike.
const svgNS = 'http://www.w3.org/2000/svg';
const BIG = 168;
function words(layer) {
  const s = document.createElementNS(svgNS, 'svg');
  s.setAttribute('width', '1920');
  s.setAttribute('height', '1080');
  s.style.cssText = 'position:absolute;left:0;top:0;overflow:visible';
  layer.appendChild(s);
  const g = document.createElementNS(svgNS, 'g');
  s.appendChild(g);
  return g;
}
function text(g, str, x) {
  const t = document.createElementNS(svgNS, 'text');
  t.setAttribute('font-family', 'inter');
  t.setAttribute('font-size', String(BIG));
  t.setAttribute('font-weight', '400');
  t.setAttribute('x', String(x));
  t.setAttribute('y', '0');
  t.setAttribute('fill', '#08080a');
  t.textContent = str;
  g.appendChild(t);
  return t;
}
// Where a line sits centred on the frame by its ink.
function centred(c, str) {
  const m = c.measureText(str);
  const l = -m.actualBoundingBoxLeft;
  const w = m.actualBoundingBoxRight - l;
  const h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  return { l, w, a: m.actualBoundingBoxAscent, x: 960 - (l + w / 2), y: 540 + m.actualBoundingBoxAscent - h / 2 };
}
// Coming in: up a little out of a blur.
function enter(n, k) {
  n.style.opacity = String(k);
  n.style.filter = `blur(${((1 - k) * 16).toFixed(2)}px)`;
  n.setAttribute('transform', `translate(0 ${((1 - k) * 30).toFixed(2)})`);
}
const titleLayer = el('div', 'layer');
const g = words(titleLayer);
// Ink box of the hero's title in the plate, at 1920×1080.
const PLATE_TITLE = { x0: 848, x1: 1022, y0: 31, y1: 56 };
let title = null;

const endLayer = el('div', 'layer');
const ug = words(endLayer);
let urlText = null;

// Grain over everything, moving as film does: a 3840×2160 field of noise,
// shifted every 1/24 s, multiplied in at a touch. The renderer lays it on
// each finished frame (render.mjs): over the page it doubled the time of
// every screenshot, and within a frame's blur it could mix two fields.
window.GRAIN = {
  svg: '<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>',
  opacity: 0.045,
  // Where the frame's top left falls in the field at t.
  at: (t) => {
    const gi = Math.floor(t * 24);
    return [960 - (((gi * 37) % 200) - 100), 540 - (((gi * 53) % 200) - 100)];
  },
};

function setupWords() {
  const c = document.createElement('canvas').getContext('2d');
  c.font = `400 ${BIG}px inter`;
  const spans = [text(g, 'Hey!', 0), text(g, 'I’m Timur', c.measureText('Hey! ').width)];
  const m = centred(c, 'Hey! I’m Timur');
  const big = { s: 1, x: m.x, y: m.y };
  const s = (PLATE_TITLE.x1 - PLATE_TITLE.x0) / m.w;
  const small = { s, x: PLATE_TITLE.x0 - m.l * s, y: PLATE_TITLE.y0 + m.a * s };
  title = { big, small, spans };
  const u = centred(c, 'timur.design');
  urlText = text(ug, 'timur.design', 0);
  ug.setAttribute('transform', `translate(${u.x.toFixed(2)} ${u.y.toFixed(2)})`);
}

// --- the timeline ---------------------------------------------------------------------
// Opening, one take: the plate's time is the reel's, less this.
const HERO_LAG = 1.6;
// The gallery's beats: [t, case], each case's arrival and its going. A
// change every 2.7 s, on the downbeat of a bar (88.9 bpm, as sound.py's
// MOVES): change one and change the other. The cases don't stand in a row
// for a camera to travel along: each comes to the stage its own way, as
// Apple's products come to their camera, and goes another.
const TRACK = [
  [9.8, 0],
  [10.9, 1], [12.5, 1],
  [13.6, 2], [15.2, 2],
  [16.3, 3], [17.9, 3],
  [19.0, 4], [20.6, 4],
  [21.7, 5], [23.3, 5],
  [24.4, 6],
];
// When each case has arrived and when it goes.
const ARRIVE = [];
const LEAVE = [];
for (const [tt, st] of TRACK) {
  if (ARRIVE[st] === undefined) ARRIVE[st] = tt;
  else LEAVE[st] = tt;
}
// The changes, on the music's downbeats: one case goes as the next comes.
const CHANGES = [9.8, 12.5, 15.2, 17.9, 20.6, 23.3];

// CSS's cubic-bezier, solved for x by halving.
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = (u) => ((ax * u + bx) * u + cx) * u;
  const Y = (u) => ((ay * u + by) * u + cy) * u;
  return (x) => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let lo = 0;
    let hi = 1;
    for (let i = 0; i < 24; i++) {
      const m = (lo + hi) / 2;
      if (X(m) < x) lo = m;
      else hi = m;
    }
    return Y((lo + hi) / 2);
  };
}
// The way Apple's products move: coming in, off the mark at once and then a
// long, soft landing; going, gathering itself and then gone.
const land = bezier(0.16, 1, 0.3, 1);
const go = bezier(0.5, 0, 0.75, 0);

// Where a thing is at t: at rest, but for its way in (from where, starting
// when, for how long) and its way out (to where). from and to are absolute;
// what they leave out stays as at rest.
const KEYS = ['x', 'y', 'z', 'rx', 'ry', 'rz', 's'];
function move(t, rest, inn, out) {
  const a = inn ? 1 - land(span(t, inn.t, inn.t + inn.d)) : 0;
  const b = out ? go(span(t, out.t, out.t + out.d)) : 0;
  const o = {};
  for (const k of KEYS) {
    const r = rest[k] ?? (k === 's' ? 1 : 0);
    const f = inn && k in inn.from ? inn.from[k] : r;
    const e = out && k in out.to ? out.to[k] : r;
    o[k] = r + a * (f - r) + b * (e - r);
  }
  return o;
}
// While a case is on stage it turns slowly, as on a turntable, and floats.
function turntable(t, i, deg) {
  const u = span(t, ARRIVE[i] - 0.8, LEAVE[i] + 0.8);
  return { ry: deg * (u * 2 - 1), y: 6 * Math.sin(t * 1.9 + i * 1.3) };
}
// The camera hardly moves: a slow sway, a little way in on each case, and
// back as the next comes.
function camera(t) {
  const on = E.smooth(span(t, 9.8, 10.8)) * (1 - E.smooth(span(t, 23.3, 24.4)));
  let z = 0;
  for (let i = 1; i <= 5; i++) {
    z += 70 * E.smooth(span(t, ARRIVE[i] - 0.5, LEAVE[i])) * (1 - E.smooth(span(t, LEAVE[i], LEAVE[i] + 0.8)));
  }
  return { z, yaw: 2 * Math.sin(((t - 9.8) / 9) * 2 * Math.PI) * on };
}
// Each diploma landing jolts the camera, a few pixels, dying at once.
const LANDINGS = [0, 1, 2].map((i) => ARRIVE[5] - 0.6 + i * 0.45 + 0.474);
function jolt(t) {
  let y = 0;
  for (const l of LANDINGS) {
    const s = t - l;
    if (s > 0 && s < 0.5) y += 4 * Math.exp(-s / 0.08) * Math.sin((2 * Math.PI * s) / 0.16);
  }
  return y;
}
// When each case is on the stage at all (its way in to its way out).
const ON_STAGE = [[0, 10.75], [9.8, 13.45], [12.45, 16.15], [15.2, 18.8], [17.9, 21.7], [20.9, 24.3], [23.3, 27.0]];
// A station's clips start a little before the camera gets there.
const clipT = (i, inPt, ft) => inPt + (ft - (ARRIVE[i] - 0.8));
// The address comes in once the page has gone, and stays a while.
const URL_IN = 27.35;
window.DURATION = 29.6;

// What is on screen: a group shows while any of its pieces is in the frame
// (with room for their shadows), so nothing pops in or out in view.
const ROOM = 200;
const inFrame = (n) => {
  const r = n.getBoundingClientRect();
  return r.right > -ROOM && r.left < 1920 + ROOM && r.bottom > -ROOM && r.top < 1080 + ROOM;
};
const groups = [
  { g: g0, parts: [site] },
  { g: g1, parts: k.map((p) => p.d) },
  { g: g2, parts: [urb.d] },
  { g: g3, parts: pair.map((p) => p.d) },
  { g: g4, parts: mons.map((p) => p.d) },
  { g: g5, parts: posters.map((p) => p.p) },
  { g: g6, parts: [outro] },
];
// Each clip, its group, and its moment for the reel's frame.
const clips = [
  { v: siteVid, g: g0, at: (ft) => ft - HERO_LAG },
  ...k.map((p) => ({ v: p.v, g: g1, at: (ft) => clipT(1, p.inPt, ft), skip: p.skip })),
  { v: urb.v, g: g2, at: (ft) => clipT(2, urb.inPt, ft) },
  ...pair.map((p) => ({ v: p.v, g: g3, at: (ft) => clipT(3, p.inPt, ft), skip: p.skip })),
  ...mons.map((p) => ({ v: p.v, g: g4, at: (ft) => clipT(4, p.inPt, ft), skip: p.skip })),
  // The plate: the page comes up (0.1–2.0s), the balls drop (2.0s on).
  { v: outroVid, g: g6, at: (ft) => 0.8 + (ft - 23.3) },
];

// Everything where it is at t (the clips aside).
function pose(t) {
  // The camera, nearly still.
  const cam_ = camera(t);
  rig.style.transform = `translate3d(0, ${jolt(t).toFixed(2)}px, ${cam_.z.toFixed(2)}px) rotateY(${cam_.yaw.toFixed(3)}deg)`;

  // 0: the title, the hero, the fling, the pull back, the scroll -------------------
  show(titleLayer, t < 2.7);
  if (t < 2.7) {
    const { big, small, spans } = title;
    spans.forEach((sp, i) => enter(sp, E.outCubic(span(t, 0.15 + i * 0.22, 0.15 + i * 0.22 + 0.7))));
    const m = E.inOutCubic(span(t, 1.5, 2.5));
    g.setAttribute('transform', `translate(${lerp(big.x, small.x, m).toFixed(2)} ${lerp(big.y, small.y, m).toFixed(2)}) scale(${lerp(big.s, small.s, m).toFixed(5)})`);
    // The title hands over to the page's own.
    titleLayer.style.opacity = t < SWAP ? '1' : '0';
  }
  patch.style.opacity = t < SWAP ? '1' : '0';
  patch2.style.opacity = String(1 - E.outCubic(span(t, SWAP, SWAP + 0.3)));
  // Pull back from full frame into 3D, then drift.
  const pb = E.inOutCubic(span(t, 5.3, 7.0));
  const dr = E.inOutSine(span(t, 7.0, 10.9));
  // And as the first case comes, it goes: back into the distance, lying back.
  const away = go(span(t, 9.7, 10.75));
  site.style.transform = tf({
    x: lerp(0, 40, pb) - dr * 80,
    y: lerp(0, 30, pb) + away * 380,
    z: -away * 2600,
    rx: lerp(0, 12, pb) - dr * 2 + away * 38,
    ry: lerp(0, -18, pb) + dr * 22,
    rz: lerp(0, 1.5, pb) - dr * 1.5,
    s: lerp(1, 0.8, pb) + dr * 0.03,
  });
  site.style.opacity = String(E.outCubic(span(t, 1.85, 2.45)) * (1 - span(t, 10.35, 10.75)));
  site.style.borderRadius = `${(pb * 30).toFixed(2)}px`;
  site.style.boxShadow = `0 0 0 1px rgba(8,8,10,${(0.06 * pb).toFixed(3)}), 0 ${(50 * pb).toFixed(1)}px ${(90 * pb).toFixed(1)}px -24px rgba(8,8,10,${(0.24 * pb).toFixed(3)})`;

  // The stations, each turning a little as the camera goes by (d: -1
  // arriving, 0 there, 1 gone), all its devices together.
  // 1: Kritika: the phones rise from below, standing up as they come, the
  // middle one first; they go up and away --------------------------------------------
  const tt1 = turntable(t, 1, 4);
  g1.style.transform = tf({ y: 10 + tt1.y, ry: tt1.ry });
  k.forEach((p, i) => {
    const rest = { x: p.x, y: i === 1 ? -10 : 12, z: i === 1 ? 60 : -40, ry: (1 - i) * 9 };
    const lag = [0.08, 0, 0.16][i];
    p.d.style.transform = tf(move(t, rest,
      { t: CHANGES[0] + lag, d: 1.25, from: { y: 1150, z: -300, rx: 40, ry: rest.ry + (1 - i) * 20 } },
      { t: CHANGES[1] - 0.1 + lag * 0.6, d: 0.85, to: { y: -1250, z: -400, rx: -30, ry: rest.ry - (1 - i) * 16 } }));
  });
  // 2: Urbantiger: the monitor flies in out of the distance, turning to face
  // us, through the gap the phones leave; it swings away to the left ---------------
  const tt2 = turntable(t, 2, -5);
  g2.style.transform = tf({ y: 26 + tt2.y, ry: tt2.ry });
  urb.d.style.transform = tf(move(t, {},
    { t: CHANGES[1] - 0.05, d: 1.35, from: { z: -3200, ry: 28, rx: -8, y: -60 } },
    { t: CHANGES[2] - 0.2, d: 0.8, to: { x: -2500, z: -700, ry: -50 } }));
  urb.d.style.opacity = String(E.outCubic(span(t, CHANGES[1] - 0.05, CHANGES[1] + 0.25)));
  // 3: Chums and Alice swing in from the right; as Alice opens, it comes
  // forward and Chums steps back; they drop away -------------------------------------
  const tt3 = turntable(t, 3, 4);
  g3.style.transform = tf({ y: tt3.y, ry: tt3.ry });
  const swap = E.inOutCubic(span(t, ARRIVE[3] - 0.1, ARRIVE[3] + 0.7));
  pair.forEach((p, i) => {
    const front = i === 1 ? swap : 1 - swap;
    const rest = { x: p.x * lerp(1, i === 1 ? 0.88 : 1.1, swap), z: lerp(-60, 50, front), ry: i === 0 ? 7 : -7 };
    p.d.style.transform = tf(move(t, rest,
      { t: CHANGES[2] + (i === 0 ? 0.1 : 0), d: 1.25, from: { x: rest.x + 2300, ry: 55, z: -400 } },
      { t: CHANGES[3] - 0.25 + i * 0.05, d: 0.7, to: { y: 1250, rx: -35, z: -200 } }));
  });
  // 4: Lendly and Yandex Cloud come down from above, and the second slides
  // out from behind the first; they fall back into the distance ----------------------
  const tt4 = turntable(t, 4, -5);
  g4.style.transform = tf({ y: 20 + tt4.y, ry: tt4.ry });
  const out_ = E.inOutCubic(span(t, ARRIVE[4] - 0.4, ARRIVE[4] + 0.5));
  mons.forEach((p, i) => {
    const rest = { x: i === 0 ? p.x : lerp(-170, p.x, out_), z: i === 0 ? 20 : lerp(-150, -30, out_), ry: i === 0 ? 9 : -9 };
    p.d.style.transform = tf(move(t, rest,
      { t: CHANGES[3] + 0.1 + i * 0.1, d: 1.3, from: { y: -1250, rx: -30, z: -500 } },
      { t: CHANGES[4] - 0.1 + i * 0.06, d: 1.0, to: { z: -2600, rx: 45, y: 250 } }));
    p.d.style.opacity = String(1 - span(t, CHANGES[4] + 0.45, CHANGES[4] + 0.95));
  });
  // 5: the diplomas, dropping onto the stack one after another ------------------------
  const tt5 = turntable(t, 5, 3);
  g5.style.transform = tf({ y: tt5.y, ry: tt5.ry });
  posters.forEach((p) => {
    // The first falls in as the camera arrives, so the frame is never empty.
    const t0 = ARRIVE[5] - 0.6 + p.i * 0.45;
    const a = clamp((t - t0) / 0.9);
    const land = outBack(a, 0.9);
    const y = lerp(-1250, p.i * 6 - 6, land);
    const rz = lerp(p.rz * 3, p.rz, E.outCubic(a));
    // And up and away, one after another, as the last page comes.
    const b = go(span(t, CHANGES[5] - 0.05 + p.i * 0.06, CHANGES[5] + 0.8 + p.i * 0.06));
    p.p.style.transform = tf({ x: p.x * lerp(0.6, 1, E.outCubic(a)), y: y - b * 1300, z: p.i * 30 - b * 300, rz: rz - b * 25 });
    p.p.style.opacity = String(a > 0 ? 1 : 0);
  });
  // 6: the end of the page, the camera coming up to it -----------------------------
  const push = E.inOutCubic(span(t, 24.2, 25.4));
  g6.style.transform = tf({});
  // It rises from below, standing up as it comes, then flat and full frame.
  const rise = 1 - land(span(t, CHANGES[5], CHANGES[5] + 1.2));
  outro.style.transform = tf({ y: rise * 1100, z: -rise * 600, ry: lerp(-16, 0, push), rx: lerp(8, 0, push) + rise * 35, s: lerp(0.8, 1, push) });
  outro.style.borderRadius = `${((1 - push) * 30).toFixed(2)}px`;
  outro.style.boxShadow = `0 0 0 1px rgba(8,8,10,${(0.06 * (1 - push)).toFixed(3)}), 0 ${(50 * (1 - push)).toFixed(1)}px ${(90 * (1 - push)).toFixed(1)}px -24px rgba(8,8,10,${(0.24 * (1 - push)).toFixed(3)})`;
  outro.style.opacity = String(1 - span(t, 26.5, 27.0));

  // On screen or not, from where everything now is.
  groups.forEach(({ g: gr, parts }, i) => show(gr, t >= ON_STAGE[i][0] && t <= ON_STAGE[i][1] && parts.some(inFrame)));
  if (t >= 27.0) show(g6, false);

  // The address, on the page's off-white.
  const onEnd = t > URL_IN;
  show(endLayer, onEnd);
  if (onEnd) enter(urlText, E.outCubic(span(t, URL_IN, URL_IN + 0.7)));
}

// The moment t, with the clips at the frame ft's own picture: within a
// frame's motion blur only the camera and what it moves blur, and the
// footage stays sharp (the plates' frames blended into ghosts).
window.renderAt = (t, ft = t) => {
  pose(t);
  return Promise.all(clips.filter((c) => c.g.style.visibility !== 'hidden').map((c) => seekFrame(c.v, c.at(ft), c.skip)));
};

// How far anything on screen moves between a and b, in pixels: what the
// renderer needs to know to blur a frame smoothly.
const movers = [site, ...k.map((p) => p.d), urb.d, ...pair.map((p) => p.d), ...mons.map((p) => p.d), ...posters.map((p) => p.p), outro];
window.motion = (a, b) => {
  const look = () => {
    const out = movers.map((n) => (n.closest('.group').style.visibility !== 'hidden' && inFrame(n) ? n.getBoundingClientRect() : null));
    if (titleLayer.style.visibility !== 'hidden') out.push(g.getBoundingClientRect());
    else out.push(null);
    return out;
  };
  pose(a);
  const A = look();
  pose(b);
  const B = look();
  let m = 0;
  A.forEach((ra, i) => {
    const rb = B[i];
    if (!ra || !rb) return;
    m = Math.max(m, Math.abs(ra.left - rb.left), Math.abs(ra.right - rb.right), Math.abs(ra.top - rb.top), Math.abs(ra.bottom - rb.bottom));
  });
  return m;
};

window.ready = (async () => {
  await document.fonts.load(`400 ${BIG}px inter`);
  setupWords();
  await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; }))));
  await Promise.all(videos.map((v) => new Promise((res) => {
    if (v.readyState >= 2) return res();
    v.addEventListener('loadeddata', () => res(), { once: true });
    v.addEventListener('error', () => res(), { once: true });
    setTimeout(res, 20000);
  })));
  return true;
})();
</script>
</body>
